services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - nivaran_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/nivaran
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in your environment}
      CLIENT_ORIGIN: http://localhost:8080
    depends_on:
      mongodb:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  nivaran_mongo:
