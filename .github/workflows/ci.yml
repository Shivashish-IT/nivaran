name: Nivaran CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      SESSION_SECRET: ci-only-session-secret-that-is-at-least-32-characters
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/nivaran_ci_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install --prefix server --no-audit --no-fund
      - name: Install frontend dependencies
        run: npm install --prefix client --no-audit --no-fund
      - name: Install root tooling
        run: npm install --no-audit --no-fund
      - name: Run full verification gate
        run: npm run verify:full
